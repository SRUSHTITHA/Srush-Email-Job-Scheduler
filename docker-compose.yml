services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postbox
      POSTGRES_PASSWORD: postbox
      POSTGRES_DB: postbox
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
